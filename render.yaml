services:
  - type: web
    name: ctgroup-kra-kpi
    runtime: node
    plan: free
    region: singapore
    rootDir: web
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: NODE_OPTIONS
        value: --max-old-space-size=450
