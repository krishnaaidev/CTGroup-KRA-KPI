services:
  - type: web
    name: ctgroup-kra-kpi
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    disk:
      name: ctgroup-data
      mountPath: /app/data
      sizeGB: 1
